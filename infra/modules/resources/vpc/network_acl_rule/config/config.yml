network_acls:
  public:
    ingress:
      allow_all:
        rule_number: 100
        protocol: "-1"
        rule_action: allow
        cidr_block: "0.0.0.0/0"
    egress:
      allow_all:
        rule_number: 100
        protocol: "-1"
        rule_action: allow
        cidr_block: "0.0.0.0/0"

  private:
    ingress:
      allow_http_from_vpc:
        rule_number: 100
        protocol: "6"
        rule_action: allow
        cidr_block: "10.0.0.0/16"
        from_port: 80
        to_port: 80
      allow_https_from_vpc:
        rule_number: 110
        protocol: "6"
        rule_action: allow
        cidr_block: "10.0.0.0/16"
        from_port: 443
        to_port: 443
    egress:
      allow_all:
        rule_number: 100
        protocol: "-1"
        rule_action: allow
        cidr_block: "0.0.0.0/0"
