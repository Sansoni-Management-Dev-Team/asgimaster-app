name: Deploy API

# main deploys to develop (staging) and production deploys to production.
on:
  push:
    branches: [main, production]
    paths:
      - 'apps/api/**'
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/main.yml'
      - 'taskdef.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ (github.ref_name == 'production' && 'production') || 'develop' }}
    env:
      AWS_ACCOUNT_ID: '806968064090'
      AWS_REGION: ap-southeast-2
      PROJECT: asgi
      ENVIRONMENT: ${{ (github.ref_name == 'production' && 'production') || 'develop' }}
      # Derived from the pinned Terraform modules and the asgi Terragrunt inputs.
      ECR_REPOSITORY: asgi-asgi-app-${{ (github.ref_name == 'production' && 'production') || 'develop' }}
      # Use the provisioned bucket. The task execution role still needs S3 read access.
      ENV_FILES_BUCKET: asgi-main-${{ (github.ref_name == 'production' && 'production') || 'develop' }}
    steps:
      - name: Checkout
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/checkout@main
      - name: Require reviewed auth release readiness
        env:
          AUTH_RELEASE_READY: ${{ vars.AUTH_RELEASE_READY }}
          RESTORE_REHEARSAL_REFERENCE: ${{ vars.RESTORE_REHEARSAL_REFERENCE }}
          RDS_CLUSTER_IDENTIFIER: ${{ vars.RDS_CLUSTER_IDENTIFIER }}
        run: |
          test "$AUTH_RELEASE_READY" = true || { echo 'Auth release readiness is not approved.'; exit 1; }
          test -n "$RESTORE_REHEARSAL_REFERENCE" || { echo 'Record the restore rehearsal before release.'; exit 1; }
          test -n "$RDS_CLUSTER_IDENTIFIER" || { echo 'Set the reviewed database cluster identifier.'; exit 1; }
      - name: Assume Role
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/assume-aws-role@main
        with:
          role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-role
          region: ${{ env.AWS_REGION }}
      - name: Set image tag
        run: |
          echo "IMAGE_TAG=v.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=${PROJECT}-app-${ENVIRONMENT}" >> "$GITHUB_ENV"
          echo "ENV_FILE_PREFIX=${PROJECT}-app-${ENVIRONMENT}/releases/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Generate and upload .env file
        run: |
          mkdir -p env
          printf 'PORT=3000\n' > env/.env

          SECRET_KEYS=(
            BETTER_AUTH_SECRET
            BETTER_AUTH_URL
            OUTBOX_ENCRYPTION_KEY
            MAIL_FROM
            MAIL_FEEDBACK_TO
            DATABASE_CA_BASE64
            TRUSTED_PROXY_CIDRS
            DATABASE_MAIN_DATABASE
            DATABASE_MAIN_HOST
            DATABASE_MAIN_PASSWORD
            DATABASE_MAIN_PORT
            DATABASE_MAIN_USERNAME
          )

          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$SECRET_NAME" --query SecretString --output text)

          for key in "${SECRET_KEYS[@]}"; do
            if ! jq -e --arg k "$key" '.[$k] | if type == "string" then length > 0 else type == "number" end' <<< "$SECRET_JSON" > /dev/null; then
              echo "Required secret setting is missing: $key"
              exit 1
            fi
            value=$(jq -r --arg k "$key" '.[$k]' <<< "$SECRET_JSON")
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "Secret setting contains an invalid newline: $key"
              exit 1
            fi
            printf '%s=%s\n' "$key" "$value" >> env/.env
          done
          printf 'MAIL_TRANSPORT=ses\n' >> env/.env

          # Retain earlier configuration, including the legacy shared object, for rollback.
          aws s3 cp env/.env "s3://${ENV_FILES_BUCKET}/${ENV_FILE_PREFIX}/.env" --only-show-errors
        env:
          # Secrets Manager accepts the name, so no generated ARN suffix is needed.
          SECRET_NAME: ${{ env.PROJECT }}-secrets-${{ env.ENVIRONMENT }}
      - name: Login to Amazon ECR
        env:
          ECR_REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - name: Build and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          docker build -f apps/api/Dockerfile -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
      - name: Update taskdef.json placeholders
        run: |
          sed -i \
            -e "s|\${name}|$NAME|g" \
            -e "s|\${image}|$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG|g" \
            -e "s|\${log_group}|$LOG_GROUP|g" \
            -e "s|\${region}|$AWS_REGION|g" \
            -e "s|\${env_file}|arn:aws:s3:::$ENV_FILES_BUCKET/$ENV_FILE_PREFIX/.env|g" \
            taskdef.json
        env:
          NAME: app
          LOG_GROUP: /ecs/${{ env.PROJECT_NAME }}
      - name: Register Task Definition
        id: register
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/register-task-definition@main
        with:
          family: ${{ env.PROJECT_NAME }}
          taskdef-path: taskdef.json
          cpu: '256'
          memory: '512'
          execution-role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-ecs-task-execution-${{ env.ENVIRONMENT }}
          task-role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT_NAME }}
      - name: Snapshot and migrate before updating the service
        id: migrate
        env:
          AUTH_RELEASE_READY: ${{ vars.AUTH_RELEASE_READY }}
          RESTORE_REHEARSAL_REFERENCE: ${{ vars.RESTORE_REHEARSAL_REFERENCE }}
          RDS_CLUSTER_IDENTIFIER: ${{ vars.RDS_CLUSTER_IDENTIFIER }}
          ECS_CLUSTER: ${{ env.PROJECT }}-main-${{ env.ENVIRONMENT }}
          ECS_SERVICE: ${{ env.PROJECT_NAME }}
          TASK_DEFINITION_ARN: ${{ steps.register.outputs.task-definition-arn }}
          RELEASE_ENVIRONMENT_FILE_ARN: arn:aws:s3:::${{ env.ENV_FILES_BUCKET }}/${{ env.ENV_FILE_PREFIX }}/.env
        run: node apps/api/scripts/migrate-ecs.mjs
      - name: Save migration and rollback references
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: migration-release-${{ github.sha }}
          path: migration-release.json
          if-no-files-found: warn
      - name: Update ECS Service
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/update-ecs-service@main
        with:
          cluster: ${{ env.PROJECT }}-main-${{ env.ENVIRONMENT }}
          service: ${{ env.PROJECT_NAME }}
          task-definition-arn: ${{ steps.register.outputs.task-definition-arn }}
          desired-count: '1'
          # Fail the workflow if the new tasks never become healthy.
          wait-for-stability: 'true'
