name: CI

on:
  pull_request:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: sansoni
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: sansoni_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sansoni -d sansoni_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sansoni:ci-only@127.0.0.1:5432/sansoni_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  api-image:
    name: Build API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Build from the repository root, as in the Sansoni deploy workflow.
      - run: docker build -f apps/api/Dockerfile -t mlai-sansoni-api:ci .
