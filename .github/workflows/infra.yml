---
name: Infra

# Terragrunt for the asgi AWS resources in infra/, set up the same way as
# Sansoni's devops-infrastructure-asgi-app. Pull requests run a plan. Pushes
# apply: main to develop (staging) and production to production.
on:
  pull_request:
    branches: [main, production]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [main, production]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  target:
    runs-on: ubuntu-latest
    # Plans compare against the branch the pull request merges into.
    environment: ${{ github.event_name != 'pull_request' && ((github.ref_name == 'production' && 'production') || 'develop') || '' }}
    env:
      AWS_ACCOUNT_ID: '806968064090'
      AWS_REGION: ap-southeast-2
      TG_VAR_ENVIRONMENT: ${{ ((github.base_ref || github.ref_name) == 'production' && 'production') || 'develop' }}
      TG_PROVIDER_CACHE: '1'
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/checkout@main
      - name: Check branch
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main' && github.ref_name != 'production'
        run: |
          echo "Run this workflow from main or production." >&2
          exit 1
      - name: Assume Role
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/assume-aws-role@main
        with:
          role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-role
          region: ${{ env.AWS_REGION }}
      - name: Read tool versions
        id: versions
        run: |
          echo "terragrunt=$(cat .terragrunt-version)" >> "$GITHUB_OUTPUT"
          echo "opentofu=$(cat .opentofu-version)" >> "$GITHUB_OUTPUT"
      - name: Install Terragrunt and OpenTofu
        # Pinned to a commit because this job holds admin credentials for the account.
        uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3.4.1
        with:
          tg_version: ${{ steps.versions.outputs.terragrunt }}
          tofu_version: ${{ steps.versions.outputs.opentofu }}
      - name: Configure git for private module access
        env:
          TF_MODULES_PAT: ${{ secrets.TF_MODULES_PAT }}
        run: |
          if [ -n "$TF_MODULES_PAT" ]; then
            git config --global url."https://x-access-token:${TF_MODULES_PAT}@github.com/Sansoni-Management-Dev-Team/".insteadOf "https://github.com/Sansoni-Management-Dev-Team/"
          else
            # No token yet, so read the modules from the copy in infra/vendor (see its README).
            git clone --quiet --mirror vendor/devops-terraform-modules.bundle "$RUNNER_TEMP/devops-terraform-modules.git"
            git config --global url."file://$RUNNER_TEMP/devops-terraform-modules.git".insteadOf "https://github.com/Sansoni-Management-Dev-Team/devops-terraform-modules.git"
          fi
      - name: plan
        id: plan
        if: github.event_name == 'pull_request'
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          terragrunt run --all plan --non-interactive --no-color --log-format json --summary-disable -- -no-color > "$RUNNER_TEMP/plan.jsonl" 2>&1
          code=$?
          set -e
          # Print the log readably, then turn it into the pull request comment.
          jq -R -r '(fromjson? // {msg: .}) | (if ."working-dir" then "[\(."working-dir")] " else "" end) + .msg' "$RUNNER_TEMP/plan.jsonl"
          python3 ../.github/scripts/terragrunt-plan-comment.py "$RUNNER_TEMP/plan.jsonl" . "$TG_VAR_ENVIRONMENT" "$code" > "$RUNNER_TEMP/plan.md"
          cat "$RUNNER_TEMP/plan.md" >> "$GITHUB_STEP_SUMMARY"
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
      - name: Comment plan on the pull request
        if: steps.plan.outcome == 'success'
        # One comment per target environment, edited on every push.
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: terragrunt-plan-${{ env.TG_VAR_ENVIRONMENT }}
          path: ${{ runner.temp }}/plan.md
      - name: Fail if the plan failed
        if: steps.plan.outputs.exit-code != '' && steps.plan.outputs.exit-code != '0'
        run: exit 1
      - name: apply
        if: github.event_name != 'pull_request'
        run: |
          terragrunt run --all apply --non-interactive
