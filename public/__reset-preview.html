<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Local prototype progress</title>
    <style>
      body { max-width: 30rem; margin: 3rem auto; padding: 1.5rem; font: 600 1rem/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
      h1 { font-size: 1.5rem; text-transform: uppercase; letter-spacing: .1em; }
      button, a { display: block; box-sizing: border-box; min-height: 3rem; width: 100%; padding: .75rem; margin-top: 1rem; font: inherit; text-align: center; }
      [hidden] { display: none; }
      #status { min-height: 3rem; }
    </style>
  </head>
  <body>
    <h1>Local prototype progress</h1>
    <p>Reset this browser's saved onboarding and activity to start a fresh demo. The previous state stays on this device and can be restored below.</p>
    <p id="status" role="status" aria-live="polite"></p>
    <button id="reset" type="button">Reset prototype progress</button>
    <button id="restore" type="button" hidden>Restore previous progress</button>
    <a href="/home">Open fresh Home</a>
    <script>
      const prefix = 'master-app.native.';
      const backupKey = 'master-app.prototype-progress-backup.v1';
      const status = document.getElementById('status');
      const reset = document.getElementById('reset');
      const restore = document.getElementById('restore');
      const keys = () => Object.keys(localStorage).filter(key => key.startsWith(prefix));
      const local = ['127.0.0.1', 'localhost', '[::1]'].includes(location.hostname);
      const readBackup = () => {
        const backup = JSON.parse(localStorage.getItem(backupKey) || 'null');
        return backup && backup.records && Object.entries(backup.records).every(([key, value]) => key.startsWith(prefix) && typeof value === 'string') ? backup : null;
      };
      function refresh() {
        reset.disabled = !local || keys().length === 0;
        restore.hidden = !local || !readBackup();
      }
      try {
        status.textContent = local ? `${keys().length} saved prototype records on this browser origin.` : 'This utility is available only on localhost.';
        refresh();
      } catch {
        status.textContent = 'Browser storage is unavailable. Nothing has been changed.';
        reset.disabled = true;
      }
      reset.addEventListener('click', () => {
        if (!local) return;
        try {
          const records = Object.fromEntries(keys().map(key => [key, localStorage.getItem(key)]));
          const count = Object.keys(records).length;
          if (!count) return;
          localStorage.setItem(backupKey, JSON.stringify({ savedAt: new Date().toISOString(), records }));
          Object.keys(records).forEach(key => localStorage.removeItem(key));
          status.textContent = `Reset complete. ${count} prototype records cleared; a restore copy remains on this device.`;
          refresh();
        } catch {
          status.textContent = 'Reset could not finish. Your saved backup, if created, remains available below.';
          refresh();
        }
      });
      restore.addEventListener('click', () => {
        if (!local) return;
        try {
          const backup = readBackup();
          if (!backup) return;
          Object.entries(backup.records).forEach(([key, value]) => localStorage.setItem(key, value));
          keys().filter(key => !(key in backup.records)).forEach(key => localStorage.removeItem(key));
          status.textContent = 'Previous prototype progress restored. Open Home to view it.';
          refresh();
        } catch {
          status.textContent = 'Restore could not finish. The backup remains saved on this device.';
        }
      });
    </script>
  </body>
</html>
